databases:
  - name: root-backend-db
    plan: free
    databaseName: root_backend
    user: root_backend

services:
  - type: web
    name: root-backend
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python -m gunicorn rootBackend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: root-backend-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_HSTS_SECONDS
        value: "3600"
